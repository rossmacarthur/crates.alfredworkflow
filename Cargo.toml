[package]
name = "crates-alfred-workflow"
version = "0.5.0"
authors = ["Ross MacArthur <ross@macarthur.io>"]
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0.86"
chrono = "0.4.38"
either = "1.13.0"
fmutex = "0.1.0"
home = "0.5.9"
libc = "0.2.155"
log = { version = "0.4.22", features = ["std"] }
once_cell = "1.19.0"
powerpack = { version = "0.5.0", features = ["detach"] }
semver = { version = "1.0.23", features = ["serde"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.120"
